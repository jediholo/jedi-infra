apiVersion: v1
kind: Service
metadata:
  name: {{ include "rpmod.fullname" . }}
  labels:
    {{- include "rpmod.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.anubis.enabled }}
    - port: {{ .Values.anubis.port }}
      targetPort: anubis
      protocol: TCP
      name: anubis
    {{- end }}
  selector:
    {{- include "rpmod.selectorLabels" . | nindent 4 }}
