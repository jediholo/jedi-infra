apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rpmod.fullname" . }}
  labels:
    {{- include "rpmod.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rpmod.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.strategy }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rpmod.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rpmod.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_ENV
              value: {{ .Values.config.environment }}
          livenessProbe:
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 10
            httpGet:
              path: /
              port: http
          readinessProbe:
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 10
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /srv/www/apps/RPMod-Web/application/configs/certs
              name: certs
              readOnly: true
            - mountPath: /srv/www/apps/RPMod-Web/application/configs/application.local.ini
              name: configs
              subPath: application.local.ini
              readOnly: true
            {{- if .Values.volumes.data }}
            - mountPath: /srv/www/apps/RPMod-Web/data
              name: data
            {{- end }}
            {{- if .Values.volumes.downloads }}
            - mountPath: /srv/www/apps/RPMod-Web/public/downloads
              name: downloads
            {{- end }}
        {{- if .Values.anubis.enabled }}
        - name: anubis
          securityContext:
            {{- toYaml .Values.anubis.securityContext | nindent 12 }}
          image: "{{ .Values.anubis.image.repository }}:{{ .Values.anubis.image.tag }}"
          imagePullPolicy: {{ .Values.anubis.image.pullPolicy }}
          ports:
            - name: anubis
              containerPort: {{ .Values.anubis.port }}
          env:
            - name: BIND
              value: ":{{ .Values.anubis.port }}"
            - name: TARGET
              value: "http://127.0.0.1:8080"
            - name: POLICY_FNAME
              value: "/data/cfg/botPolicy.yaml"
            {{- if .Values.anubis.privateKey }}
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: {{ include "rpmod.fullname" . }}-anubis-private-key
                  key: ED25519_PRIVATE_KEY_HEX
            {{- end }}
            {{- with .Values.anubis.redirectDomains }}
            - name: REDIRECT_DOMAINS
              value: "{{ . }}"
            {{- end }}
          resources:
            {{- toYaml .Values.anubis.resources | nindent 12 }}
          volumeMounts:
            - name: anubis-config
              mountPath: /data/cfg
              readOnly: true
            {{- if .Values.volumes.anubis }}
            - name: anubis-data
              mountPath: /data
            {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: certs
          secret:
            secretName: {{ include "rpmod.fullname" . }}-certs
        - name: configs
          secret:
            secretName: {{ include "rpmod.fullname" . }}-configs
        {{- with .Values.volumes.data }}
        - name: data
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.volumes.downloads }}
        - name: downloads
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.anubis.enabled }}
        - name: anubis-config
          secret:
            secretName: {{ include "rpmod.fullname" . }}-anubis-config
        {{- with .Values.volumes.anubis }}
        - name: anubis-data
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
