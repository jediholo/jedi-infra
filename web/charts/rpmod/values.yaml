# Default values for rpmod.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
strategy: RollingUpdate

image:
  repository: ghcr.io/jediholo/rpmod-web
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector:
  server-role-web: "true"

tolerations: []

affinity: {}

volumes:
  data: {}
    # hostPath:
    #   path: /home/domains/example.org/apps/RPMod-Web/data
    #   type: DirectoryOrCreate
  downloads: {}
    # hostPath:
    #   path: /home/domains/example.org/apps/RPMod-Web/public/downloads
    #   type: DirectoryOrCreate
  anubis: {}
    # hostPath:
    #   path: /home/domains/example.org/apps/RPMod-Web/data/anubis
    #   type: DirectoryOrCreate

certificates:
  gameasset:
    privateKey: ""
    publicKey: ""
  oidc:
    jwks: ""
    privateKey: ""
    publicKey: ""

config:
  application:
    development: {}
    production: {}
      # "resources.doctrine.connections.rpmod.dsn": "mysql://user:pass@dbhost/dbname"
      # "discord.pubkey": "toComplete"
      # "recaptcha.pubkey": "toComplete"
      # "recaptcha.privkey": "toComplete"
  environment: production

cron:
  enabled: true
  schedule: "*/5 * * * *"
  concurrencyPolicy: Allow

anubis:
  enabled: false
  image:
    repository: ghcr.io/techarohq/anubis
    pullPolicy: IfNotPresent
    tag: latest
  port: 8923
  config:
    bots:
      - import: (data)/meta/default-config.yaml
      - name: assets
        path_regex: '^/(css|img|js)/.*$'
        action: ALLOW
      - name: files
        path_regex: ^/(downloads|files|repos)/.*$
        action: ALLOW
      - name: icons
        path_regex: '^/(android-chrome|apple-touch-icon)[^/]*\.png$'
        action: ALLOW
      - name: webmanifest
        path_regex: '^/site\.webmanifest$'
        action: ALLOW
      - name: ws
        path_regex: ^/ws/.*$
        action: ALLOW
    openGraph:
      passthrough: true
      ttl: 24h
    store:
      backend: bbolt
      parameters:
        path: /data/anubis.bdb
  env: {}
    # MAXMIND_LICENSE_KEY: "toComplete"
    # ED25519_PRIVATE_KEY_HEX: "toComplete" # hex-encoded ed25519 private key (openssl rand -hex 32)
    # REDIRECT_DOMAINS: example.org
  resources: {}
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
