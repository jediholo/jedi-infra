{{- if .Values.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordpress.fullname" . }}-env
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.env }}
  {{ tpl $key $ }}: {{ tpl (print $value) $ | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.anubis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordpress.fullname" . }}-anubis-config
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
type: Opaque
stringData:
  botPolicy.yaml: |
    {{- .Values.anubis.config | toYaml | nindent 4 }}
---
{{- if .Values.anubis.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordpress.fullname" . }}-anubis-env
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.anubis.env }}
  {{ tpl $key $ }}: {{ tpl (print $value) $ | quote }}
  {{- end }}
{{- end }}
{{- end }}
