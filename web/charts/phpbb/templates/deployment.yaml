apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phpbb.fullname" . }}
  labels:
    {{- include "phpbb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "phpbb.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.strategy }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "phpbb.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "phpbb.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.env }}
          envFrom:
            - secretRef:
                name: {{ include "phpbb.fullname" . }}-env
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /etc/apache2/conf.d/custom.conf
              name: config
              subPath: apache.conf
            - mountPath: /etc/php8/conf.d/custom.ini
              name: config
              subPath: php.ini
          {{- if .Values.volumes.files }}
            - mountPath: /srv/www/apps/phpbb/files
              name: files
          {{- end }}
          {{- if .Values.volumes.images }}
            - mountPath: /srv/www/apps/phpbb/images
              name: images
          {{- end }}
          {{- if .Values.volumes.store }}
            - mountPath: /srv/www/apps/phpbb/store
              name: store
          {{- end }}
        {{- if .Values.anubis.enabled }}
        - name: anubis
          securityContext:
            {{- toYaml .Values.anubis.securityContext | nindent 12 }}
          image: "{{ .Values.anubis.image.repository }}:{{ .Values.anubis.image.tag }}"
          imagePullPolicy: {{ .Values.anubis.image.pullPolicy }}
          ports:
            - name: anubis
              containerPort: {{ .Values.anubis.port }}
          env:
            - name: BIND
              value: ":{{ .Values.anubis.port }}"
            - name: TARGET
              value: "http://127.0.0.1:8080"
            - name: POLICY_FNAME
              value: "/data/cfg/botPolicy.yaml"
          {{- if .Values.anubis.env }}
          envFrom:
            - secretRef:
                name: {{ include "phpbb.fullname" . }}-anubis-env
          {{- end }}
          resources:
            {{- toYaml .Values.anubis.resources | nindent 12 }}
          volumeMounts:
            - name: anubis-config
              mountPath: /data/cfg
              readOnly: true
            {{- if .Values.volumes.anubis }}
            - name: anubis-data
              mountPath: /data
            {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "phpbb.fullname" . }}-config
        {{- with .Values.volumes.files }}
        - name: files
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.volumes.images }}
        - name: images
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.volumes.store }}
        - name: store
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.anubis.enabled }}
        - name: anubis-config
          secret:
            secretName: {{ include "phpbb.fullname" . }}-anubis-config
        {{- with .Values.volumes.anubis }}
        - name: anubis-data
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
