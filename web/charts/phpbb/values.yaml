# Default values for phpbb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
strategy: RollingUpdate

image:
  repository: ghcr.io/fab-infra/phpbb
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector:
  server-role-web: "true"

tolerations: []

affinity: {}

env: {}
  # PHPBB_COOKIE_SECURE: "yes"
  # PHPBB_DATABASE_HOST: "mariadb"
  # PHPBB_DATABASE_NAME: "bitnami_phpbb"
  # PHPBB_DATABASE_PASSWORD: "toComplete"
  # PHPBB_DATABASE_USER: "bn_phpbb"
  # PHPBB_DISABLE_SESSION_VALIDATION: "true"
  # PHPBB_EMAIL: "user@example.com"
  # PHPBB_FORUM_DESCRIPTION: "A little text to describe your forum"
  # PHPBB_FORUM_NAME: "My forum"
  # PHPBB_FORUM_SERVER_PROTOCOL: "https://"
  # PHPBB_HOST: "example.com"

config:
  apache: ""
  php: {}

volumes:
  files: {}
    # hostPath:
    #   path: /home/domains/example.org/apps/phpbb/files
    #   type: DirectoryOrCreate
  images: {}
    # hostPath:
    #   path: /home/domains/example.org/apps/phpbb/images
    #   type: DirectoryOrCreate
  store: {}
    # hostPath:
    #   path: /home/domains/example.org/apps/phpbb/store
    #   type: DirectoryOrCreate
  anubis: {}
    # hostPath:
    #   path: /home/domains/example.org/apps/phpbb/anubis
    #   type: DirectoryOrCreate

anubis:
  enabled: false
  image:
    repository: ghcr.io/techarohq/anubis
    pullPolicy: IfNotPresent
    tag: latest
  port: 8923
  config:
    bots:
      - import: (data)/meta/default-config.yaml
      - name: assets
        path_regex: '^/(assets|images|styles)/.*$'
        action: ALLOW
      - name: files
        path_regex: ^/download/.*$
        action: ALLOW
    openGraph:
      passthrough: true
      ttl: 24h
    store:
      backend: bbolt
      parameters:
        path: /data/anubis.bdb
  env: {}
    # MAXMIND_LICENSE_KEY: "toComplete"
    # ED25519_PRIVATE_KEY_HEX: "toComplete" # hex-encoded ed25519 private key (openssl rand -hex 32)
    # REDIRECT_DOMAINS: example.org
  resources: {}
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
