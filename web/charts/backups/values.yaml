# Default values for backups.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

backoffLimit: 0

image:
  repository: ghcr.io/fab-infra/backuptools
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

nodeSelector:
  server-role-web: "true"

tolerations: []

affinity: {}

backends:
  ftp:
    host: ""      # ftpbackup.example.org
    dir: ""       # example
  gcs:
    bucket: ""    # example-org-backups
  s3:
    provider: ""  # OVH
    region: ""    # rbx
    bucket: ""    # example-org-backups
  swift:
    container: "" # example-org-backups

backups:
  files:
    backends: ""  # swift,gcs,ftp
    subdir: ""    # files
  ldap:
    backends: ""  # swift,gcs,ftp
    subdir: ""    # ldap
  mysql:
    backends: ""  # swift,gcs,ftp
    subdir: ""    # mysql
    host: ""      # mysql-slave
    port: ""      # 3306
  skinpack:
    backends: ""  # fs
    subdir: ""    # downloads
    basename: ""  # JEDI_Skins
    sourceDir: "" # /srv/www/sd/files/htdocs/repos/jedi-skins/assets
    targetDir: "" # /srv/www/sd/files/htdocs
    filePattern: "*.pk3"
  sync:
    backends: ""  # swift,gcs
    args: ""      # pcs:container gcs:bucket

schedules: {}
  # files: "30 5 * * *"
  # ldap: "0 5 * * *"
  # mysql: "0 5 * * *"
  # skinpack: "15 5 * * *"
  # sync: "0 5 * * *"

secrets:
  ftp:
    username: ""
    password: ""
  gcs:
    sa: ""
  s3:
    accessKeyId: ""
    secretAccessKey: ""
  swift:
    openrc: ""
  mysql:
    username: ""
    password: ""

env: {}

volumes:
  domain: {}
    # hostPath:
    #   path: /home/domains/example.org
    #   type: DirectoryOrCreate
  ldap: {}
    # hostPath:
    #   path: /home/domains/example.org/ldap
    #   type: DirectoryOrCreate
