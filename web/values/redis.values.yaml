fullnameOverride: redis

image:
  repository: docker.io/redis
  tag: "8.2.3"

podSecurityContext:
  runAsUser: 1004
  runAsGroup: 1005

nodeSelector:
  server-role-web: "true"
  domain-jediholo-net: "true"

volumes:
  data:
    hostPath:
      path: /home/domains/jediholo.net/apps/redis
      type: DirectoryOrCreate
