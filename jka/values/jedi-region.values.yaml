fullnameOverride: jedi-region

image:
  repository: ghcr.io/jediholo/jka-server
  tag: master-2026.08.02-40a0624

service:
  port: 29072
  nodePort: 30072
  alternatePort: 29172
  alternateNodePort: 30172

podSecurityContext:
  runAsUser: 1100
  runAsGroup: 1100

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 1000m
    memory: 512Mi

volumes:
  - name: dumps
    hostPath:
      path: /home/jka/_shared_/rpmod/dumps
volumeMounts:
  - mountPath: /opt/openjk/homepath/rpmod/dumps
    name: dumps

jka:
  homepath: /home/jka/jedi-region
  cvars:
    sv_hostname: "^7The ^5::^7JEDI^5:: ^7Region - www.jediholo.net"
    g_motd: "Welcome to the ::JEDI:: Region"
    rp_motd: "^5::^7JEDI^5:: ^7Region\\nwww.jediholo.net\\n\\n^1Strict Roleplaying Environment\\n^7Please respect the ^3rules^7, be ^3respectful^7,\\ndownload the ^3RPMod Client^7\\nand have fun!\\n\\nThe ^5::^7JEDI^5::^7 Temple can be found at\\n^5 temple.jediholo.net:29070"
    rp_accounts_AM_enabled: "1"
    rp_accounts_AM_serviceUsername: "region.jediholo.net@29072"
    # Admin commands bitvalues: https://rpmod.jediholo.net/tools/bitvalues
    rp_adminRank_cmds1: "35269667457153" # Instructor
    rp_adminRank_cmds2: "60317946019783" # Watchman
    rp_adminRank_cmds3: "70368169557959" # Mission Director
    rp_adminRank_cmds4: "70368169557959" # Department Head
    rp_adminRank_cmds5: "70368152780679" # Honorary Admin
    rp_adminRank_cmds6: "70368739983359" # Council

    rp_adminRank_name1: "Instructor"
    rp_adminRank_name2: "Watchman"
    rp_adminRank_name3: "Mission Director"
    rp_adminRank_name4: "Department Head"
    rp_adminRank_name5: "Honorary Admin"
    rp_adminRank_name6: "Council"
    rp_adminRank_name7: "^1God"
    rp_adminRank_god: "7"   
    g_privateDuel: "0"

logrotate:
  enabled: true
  schedule: "0 6 * * *"
  image:
    repository: ghcr.io/fab-infra/logrotate
    tag: 3.22-opensuse16-2026.08.23-d985a32

mock:
  enabled: false
  image:
    repository: ghcr.io/fcrespel/q3mockserver
    tag: master-2026.08.05-539f4d4
  args: [
    "-i", "game=rpmod",
    "-i", "mapname=simulator",
    "-i", "hostname=^7The ^5::^7JEDI^5:: ^7Region - www.jediholo.net",
    "-s", "gamename=RPMod 0.5.1c",
    "-s", "mapname=simulator",
    "-s", "sv_hostname=^7The ^5::^7JEDI^5:: ^7Region - www.jediholo.net",
    "-m", "The JEDI Region server has moved to 94.23.252.71:29072",
  ]
  hostPort: 29072
  nodeSelector:
    kubernetes.io/hostname: ks13

exporter:
  enabled: true
  image:
    repository: ghcr.io/fcrespel/jka-exporter
    tag: 1.1.0
  args: ["-enable-rpmetrics", "-exporter", "otlphttp", "-log-format", "json", "-log-level", "debug"]
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://${HOST_IP}:4318"
    OTEL_RESOURCE_ATTRIBUTES: "service.instance.id=jedi-region"
